name: CardiLearn prototype

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and prototype dependencies
        run: python -m pip install -e '.[dev]' && python -m pip install 'torch>=2.2,<3'
      - name: Run prototype, interpretability, perturbation, and benchmark lint
        run: >-
          ruff check cardilearn/prototype cardilearn/interpretability cardilearn/perturbation
          cardilearn/benchmark_protocol.py cardilearn/leakage.py cardilearn/cross_species.py
          cardilearn/research_model.py cardilearn/objectives.py cardilearn/conserved.py
          cardilearn/backbones.py cardilearn/representation_benchmark.py cardilearn/singlecell.py
          cardilearn/spatial.py cardilearn/trajectory.py cardilearn/torch_training.py
          scripts/run_prototype.py scripts/train_real_data.py scripts/fetch_ncbi_metadata.py scripts/source_rescue_audit.py
          tests/test_cardi_learn_prototype.py tests/test_interpretability.py
          tests/test_perturbation.py tests/test_benchmark_protocol.py tests/test_leakage.py
          tests/test_cross_species.py --select E9,F
      - name: Run prototype tests
        run: pytest -q tests/test_cardi_learn_prototype.py
      - name: Run Step 10 leakage tests
        run: pytest -q tests/test_leakage.py tests/test_study_family_splits.py
      - name: Run Step 11 cross-species tests
        run: pytest -q tests/test_cross_species.py
      - name: Run Step 11 adversarial-head smoke test
        run: >-
          python -c "import torch; from cardilearn.prototype.species_adversary import SpeciesAdversary;
          z=torch.randn(8,16,requires_grad=True); m=SpeciesAdversary(16,3,coefficient=0.5);
          y=m(z); y.sum().backward(); assert y.shape==(8,3) and z.grad is not None"
      - name: Run Step 13 interpretability tests
        run: pytest -q tests/test_interpretability.py
      - name: Run Step 14 perturbation tests
        run: pytest -q tests/test_perturbation.py
      - name: Run Step 15 benchmark protocol tests
        run: pytest -q tests/test_benchmark_protocol.py
      - name: Run research representation and training tests
        run: pytest -q tests/test_research_model.py tests/test_torch_training.py tests/test_benchmark_suite.py tests/test_multimodal.py
      - name: Compile real-data and source-rescue runners
        run: python -m py_compile scripts/train_real_data.py scripts/source_rescue_audit.py scripts/step3_sra_reprocess.py
      - name: Run source-rescue audit unit tests
        run: pytest -q tests/test_source_rescue_audit.py
      - name: Run SRA rescue unit tests
        run: pytest -q tests/test_step3_sra_reprocess.py
      - name: Run synthetic smoke experiment
        run: python scripts/run_prototype.py
