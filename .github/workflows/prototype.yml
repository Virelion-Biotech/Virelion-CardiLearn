name: CardiLearn prototype

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and prototype dependencies
        run: python -m pip install -e '.[dev]' && python -m pip install 'torch>=2.2,<3'
      - name: Run prototype lint
        run: ruff check cardilearn/prototype cardilearn/leakage.py scripts/run_prototype.py tests/test_cardi_learn_prototype.py tests/test_leakage.py --select E9,F
      - name: Run prototype tests
        run: pytest -q tests/test_cardi_learn_prototype.py
      - name: Run Step 10 leakage tests
        run: pytest -q tests/test_leakage.py tests/test_study_family_splits.py
      - name: Run synthetic smoke experiment
        run: python scripts/run_prototype.py
