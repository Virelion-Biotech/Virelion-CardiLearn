schema_version: "1.3"

experiment:
  name: cardilearn_research_v1
  task: cardiac_state_representation_learning
  model: cardilearn_research
  status: unvalidated_research_configuration
  biological_scope: development_maturation_injury_regeneration

data:
  matrix_format: anndata_or_sparse
  observation_hierarchy: study_family_id > study_id > subject_id > sample_id > cell_or_nucleus_id
  raw_expression_required: true
  unresolved_metadata: reject

representation:
  value_style: continuous
  gene_dim: 256
  n_programs: 128
  n_layers: 6
  n_heads: 8
  backbone: transformer
  optional_backbone: mamba
  shared_dim: 384
  private_dim: 128
  decoder_dim: 256
  router_chunk_size: 2048
  grn_prior: optional_explicit_gene_program_matrix
  grn_prior_strength: 0.0

decoder:
  likelihood: negative_binomial
  factorized_gene_output: true
  library_size_conditioning: true

objectives:
  schedule:
    - name: representation
      epochs: 1
      reconstruction: 1.0
      masked: 1.0
      contrastive: 0.0
      vicreg: 0.10
      cell_type: 0.0
      maturation: 0.0
      injury: 0.0
      species_adversarial: 0.0
    - name: biological_state
      epochs: remaining
      reconstruction: 1.0
      masked: 1.0
      contrastive: 0.25
      vicreg: 0.10
      cell_type: 0.50
      maturation: 1.0
      injury: 0.50
      species_adversarial: 0.0

validation:
  no_random_cell_split: true
  biological_split_unit: study_family_id
  external_study_required: true
  cross_species_required_when_claimed: true
  final_test_locked: true
  multiple_seeds: [13, 42, 73, 101, 131]

guardrails:
  train_only_feature_selection: true
  train_only_preprocessing: true
  no_unresolved_labels: true
  no_synthetic_pairs_as_real_pairs: true
  causal_claims_require_experiment: true
