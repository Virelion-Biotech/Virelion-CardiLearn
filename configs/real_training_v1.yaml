schema_version: "1.0"

experiment:
  name: cardilearn_real_training_v1
  task: representation_learning
  model: cardilearn_large
  model_scale: transcriptome_scale

input:
  expression: /path/to/training_ready_expression.npz
  metadata: /path/to/training_ready_metadata.parquet
  matrix_orientation: observations_by_genes
  n_genes: 20000

splits:
  group_column: study_id
  policy: study_grouped
  selection_split: validation
  report_split: test
  locked_test: true

preprocessing:
  feature_selection: train_only
  normalization: train_only
  imputation: train_only
  unknown_metadata: reject
  species_orthology: explicit_review_required

training:
  seeds: [13, 42, 73, 101, 131]
  primary_seed: 42
  epochs: 10
  batch_size: 8
  gradient_accumulation: required_for_memory_constrained_hardware
  mixed_precision: recommended
  device: auto

required_metadata:
  - study_id
  - subject_id
  - sample_id
  - species
  - assay
  - cell_type
  - maturation
  - injury

architecture:
  gene_dim: 1024
  n_programs: 32
  n_layers: 6
  n_heads: 16
  shared_dim: 512
  private_dim: 128

# This configuration describes the serious research model. It must not be
# interpreted as evidence that the model has been biologically validated.

guardrails:
  train_only_fit: true
  no_random_cell_split: true
  no_unresolved_labels: true
  raw_expression_not_committed: true
  empirical_claims_require_locked_test: true
  biological_claims_require_external_validation: true
